name: K-SYNTH-1 Run416 lossless compiler replay

on:
  workflow_dispatch:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run416/**'
      - '.github/workflows/k-synth-run416-lossless.yml'

permissions:
  contents: read

jobs:
  run416-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute adversarial and frozen-oracle contract tests
        run: |
          cd research/K-SYNTH-1/run416
          python -m unittest -v test_run416 test_run416_httpx_oracle 2>&1 | tee run416_cloud_tests.txt
      - name: Reproduce paired compiler and isolated functional experiment
        run: |
          cd research/K-SYNTH-1/run416
          python run416_experiment.py | tee run416_cloud_summary.txt
          echo 'c54a0e04c32ea880245cba51747a0129daef31764cfcadfbdc78f385c8b22e32  run416_raw.jsonl' | sha256sum -c -
      - name: Independent read-only audit and replay
        run: |
          cd research/K-SYNTH-1/run416
          python run416_independent_audit.py | tee run416_cloud_audit.txt
      - name: Preserve original raw evidence even if a scientific assertion fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k-synth-run416-lossless-replay
          path: |
            research/K-SYNTH-1/run416/run416_raw.jsonl
            research/K-SYNTH-1/run416/run416_summary.json
            research/K-SYNTH-1/run416/run416_audit.json
            research/K-SYNTH-1/run416/run416_cloud_*.txt
          if-no-files-found: warn
          retention-days: 30
