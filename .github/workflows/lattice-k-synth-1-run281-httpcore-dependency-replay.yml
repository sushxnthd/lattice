name: Lattice K-SYNTH-1 Run281 HTTPcore frozen dependency replay
on:
  workflow_dispatch:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run281/LAUNCH_RUN281.txt'
permissions:
  contents: read
jobs:
  httpcore-frozen-dependency-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact SHA-pinned frozen Run279 sources
        run: |
          python - <<'PYRESTORE'
          import base64,hashlib,io,pathlib,tarfile,zlib
          root=pathlib.Path('research/K-SYNTH-1/run279')
          compressed=base64.b64decode((root/'run279_frozen_sources.tar.zlib.b64').read_text())
          assert hashlib.sha256(compressed).hexdigest()=='d7c71fac1cc9272ef6f62fa9bd8e36260f1fe748634ec9fa1d59e65dfed3a923'
          with tarfile.open(fileobj=io.BytesIO(zlib.decompress(compressed))) as archive:
              for member in archive.getmembers():
                  assert member.name in {'run279_httpcore_1000_qualify.py','idle_cardinality_ir.py','test_run279_freeze.py','test_idle_cardinality_ir.py','FROZEN_RUN279.json','RUN279_SHA256SUMS'}
                  assert member.isfile() and '/' not in member.name
                  (root/member.name).write_bytes(archive.extractfile(member).read())
          PYRESTORE
          (cd research/K-SYNTH-1/run279 && sha256sum -c RUN279_SHA256SUMS)
      - name: Run original frozen scientific integrity tests
        run: |
          cd research/K-SYNTH-1/run279
          python -m unittest -v test_run279_freeze.py test_idle_cardinality_ir.py
      - name: Install complete upstream-declared HTTPcore dependencies
        run: |
          python -m pip install 'certifi>=2024,<2027' 'h11>=0.16,<1' 'h2>=4,<5' 'anyio>=4,<5' 'sniffio>=1,<2'
          python -m pip freeze > "$RUNNER_TEMP/run281-dependencies.txt"
          python - <<'PYDEPS'
          import certifi,h11,h2,anyio,sniffio
          print('UPSTREAM_REQUIRED_IMPORTS_OK')
          PYDEPS
      - name: Restore exact pinned upstream parent and source-identical reference
        run: |
          git clone --quiet https://github.com/encode/httpcore.git "$RUNNER_TEMP/httpcore-base"
          git -C "$RUNNER_TEMP/httpcore-base" checkout --quiet --detach 5974b03c7df89d3ee4e23779900d5349d550753c
          git -C "$RUNNER_TEMP/httpcore-base" worktree add --quiet --detach "$RUNNER_TEMP/httpcore-ref" 10a658221deb38a4c5b16db55ab554b0bf731707
          test "$(git -C "$RUNNER_TEMP/httpcore-ref" rev-parse HEAD^)" = 5974b03c7df89d3ee4e23779900d5349d550753c
          test "$(git -C "$RUNNER_TEMP/httpcore-ref" hash-object httpcore/_sync/connection_pool.py)" = 4b26f9c63032be5c6c932b9d1339c43d4029368e
          test "$(git -C "$RUNNER_TEMP/httpcore-ref" hash-object httpcore/_async/connection_pool.py)" = 5ef74e6497f1fe44b7be520f8e1502e8786e91fd
      - name: Replay UNCHANGED frozen 4 x 10 oracle and preserve all outcomes
        run: |
          mkdir -p "$RUNNER_TEMP/run281-results"
          python research/K-SYNTH-1/run280/run280_transport_alias.py --base "$RUNNER_TEMP/httpcore-base" --ref "$RUNNER_TEMP/httpcore-ref" --out "$RUNNER_TEMP/run281-results"
          cp research/K-SYNTH-1/run279/FROZEN_RUN279.json "$RUNNER_TEMP/run281-results/"
          cp research/K-SYNTH-1/run279/RUN279_SHA256SUMS "$RUNNER_TEMP/run281-results/"
          cp "$RUNNER_TEMP/run281-dependencies.txt" "$RUNNER_TEMP/run281-results/"
          cp research/K-SYNTH-1/run280/run280_transport_alias.py "$RUNNER_TEMP/run281-results/"
          (cd "$RUNNER_TEMP/run281-results" && sha256sum * > ARTIFACT_SHA256SUMS)
          python - <<'PYREPORT'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'run281-results'/'raw_results.json'
          x=json.loads(p.read_text())
          print(json.dumps({'qualified':x['qualified'],'counts':x['counts'],'returncodes':{r['configuration']:r['returncode'] for r in x['records']}},sort_keys=True))
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run281-httpcore1000-frozen-dependency-replay
          path: ${{ runner.temp }}/run281-results/
          if-no-files-found: warn
          retention-days: 30
