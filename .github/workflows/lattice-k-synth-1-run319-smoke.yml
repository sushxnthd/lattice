name: Lattice K-SYNTH-1 Run319 decorator-span smoke
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run319/**'
      - '.github/workflows/lattice-k-synth-1-run319-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decorator-span-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run trusted decorator-span smoke checks
        run: python research/K-SYNTH-1/run319/run319_smoke_test.py
