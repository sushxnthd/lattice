name: codegen-equal-budget-v1
on:
  push:
    branches: [research/codegen-equal-budget-v1]
    paths:
      - "experiments/run_codegen_equal_budget_v1_matched.py"
      - ".github/workflows/codegen-equal-budget-v1.yml"
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - run: python -m pip install "transformers>=4.45,<5"
      - run: python experiments/run_codegen_equal_budget_v1_matched.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegen-equal-budget-v1
          path: artifacts/
