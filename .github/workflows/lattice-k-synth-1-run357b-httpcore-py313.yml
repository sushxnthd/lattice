name: K-SYNTH-1 Run357b CPython3.13 frozen HTTPcore paired Qwen
on:
  push:
    branches: [research/exp003-context-order]
    paths: ['.github/workflows/lattice-k-synth-1-run357b-httpcore-py313.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lattice-run357b-httpcore-qwen
  cancel-in-progress: false
jobs:
  real-model-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore verified runner and pinned historical baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run357-results
          python - <<'PY'
          import base64,hashlib,pathlib,zlib
          d=pathlib.Path('research/K-SYNTH-1/run357')
          raw=zlib.decompress(base64.b64decode((d/'run357_paired.py.zlib.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='627371dc4e08454aa15888ada1d2e42ba25855cd351220b7ce99bb655fc9cc0c'
          (d/'run357_paired.py').write_bytes(raw)
          PY
          git clone --quiet https://github.com/encode/httpcore.git /tmp/run357-httpcore
          git -C /tmp/run357-httpcore checkout --quiet --detach c46802478cdd8a82ee8cb333420080fab1aed00b
          test "$(git -C /tmp/run357-httpcore rev-parse HEAD)" = c46802478cdd8a82ee8cb333420080fab1aed00b
          test "$(git -C /tmp/run357-httpcore rev-parse HEAD:httpcore/_sync/http11.py)" = e108f88b124043b05258f6d98363119b79f92d88
          test "$(git -C /tmp/run357-httpcore rev-parse HEAD:httpcore/_async/http11.py)" = a5eb480840dd4eae73bc8285c9d374a09a0bd44c
          git rev-parse HEAD >run357-results/lattice_commit.txt
          git -C /tmp/run357-httpcore rev-parse HEAD >run357-results/httpcore_commit.txt
      - name: Reproduce prospective prompt freeze and information parity
        shell: bash
        run: |
          set -euo pipefail
          python research/K-SYNTH-1/run357/run357_paired.py freeze /tmp/run357-httpcore run357-results >run357-results/freeze_stdout.json
          python - <<'PY'
          import importlib.util,json,pathlib
          root=pathlib.Path('run357-results')
          f=json.loads((root/'RUN357_FREEZE.json').read_text())
          assert f['fact_sha256']=='bd3c22686e5499429badccb2f15b1375e7a530ffb01f606f92776f3b9daff4e8'
          assert f['fact_records']==112
          assert f['requests']['IR']['prompt_sha256']=='e6f75e8b9e594d21c198e36c8c50ad4d8f3b7a6b50b5d3737856ff556dcd8dcd'
          assert f['requests']['PYTHON_AST']['prompt_sha256']=='184a9b7e7207a4694e7cdb706ce6f58aa7d9b2ac0b23521bf65fdd060c127fbd'
          s=importlib.util.spec_from_file_location('paired','research/K-SYNTH-1/run357/run357_paired.py')
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          ledger=json.loads((root/'RUN357_FACTS.json').read_text())
          for arm in ('IR','PYTHON_AST'):
           p=json.loads((root/f'request_{arm}.json').read_text())['messages'][0]['content']
           start=p.index('BOUNDED_DATAFLOW_IR_GRAPH_V1') if arm=='IR' else p.index('PYTHON_AST_BINDINGS = ')
           end=p.index('\n\nOriginal authorized source with ORIGINAL line numbers:',start)
           rec=m.reconstruct_ir(p[start:end]) if arm=='IR' else m.reconstruct_python(p[start:end])
           assert rec==ledger
          print('FROZEN_SOURCE_AND_FACT_PARITY_VERIFIED')
          PY
      - name: Build pinned llama.cpp and SHA-verify no-cost Qwen 7B weights
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git /tmp/run357-llama
          test "$(git -C /tmp/run357-llama rev-parse HEAD)" = 620d2225cc436ab0b001e3200e590e3b286ef9ab
          cmake -S /tmp/run357-llama -B /tmp/run357-llama/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/run357-llama/build -j 2 --target llama-server
          curl -fL --retry 3 --retry-all-errors -o /tmp/run357-model.gguf https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  /tmp/run357-model.gguf' | sha256sum -c -
          sha256sum /tmp/run357-model.gguf >run357-results/model.sha256
          git -C /tmp/run357-llama rev-parse HEAD >run357-results/llama_commit.txt
      - name: Actual tokenizer measurement and genuine paired model completions
        shell: bash
        run: |
          set -uo pipefail
          /tmp/run357-llama/build/bin/llama-server -m /tmp/run357-model.gguf --alias Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M --host 127.0.0.1 --port 8080 -c 16384 -t 2 -np 1 >run357-results/llama.log 2>&1 &
          for i in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8080/health | grep -q ok && break
            sleep 2
          done
          python - <<'PY'
          import json,pathlib,urllib.request
          root=pathlib.Path('run357-results');rows=[]
          for arm in ('IR','PYTHON_AST'):
           req=json.loads((root/f'request_{arm}.json').read_text())
           data=json.dumps({'content':req['messages'][0]['content']}).encode()
           request=urllib.request.Request('http://127.0.0.1:8080/tokenize',data=data,headers={'Content-Type':'application/json'})
           try:
            with urllib.request.urlopen(request,timeout=180) as f:n=len(json.load(f)['tokens'])
            rows.append({'arm':arm,'prompt_tokens_raw':n,'completion_budget':3500,'within_context':n+3500<16384})
           except Exception as e:rows.append({'arm':arm,'tokenizer_error':str(e),'within_context':False})
          (root/'token_budget.json').write_text(json.dumps(rows,indent=2)+'\n');print(rows)
          PY
          if python -c "import json; assert all(x['within_context'] for x in json.load(open('run357-results/token_budget.json')))"; then
            for arm in IR PYTHON_AST; do
              python research/K-SYNTH-1/run357/run357_paired.py infer /tmp/run357-httpcore run357-results --arm "$arm" >"run357-results/infer_$arm.stdout" 2>"run357-results/infer_$arm.stderr" || true
              python research/K-SYNTH-1/run357/run357_paired.py compile /tmp/run357-httpcore run357-results --arm "$arm" >"run357-results/compile_$arm.stdout" 2>"run357-results/compile_$arm.stderr" || true
            done
          else
            echo 'PRECOMPLETION_CONTEXT_OR_TOKENIZER_FAILURE' >run357-results/inference_failure.txt
          fi
      - name: Evaluate baseline and candidate patches in isolated Docker
        shell: bash
        run: |
          set -uo pipefail
          cat >/tmp/run357.Dockerfile <<'EOF'
          FROM python:3.11-slim
          RUN pip install --disable-pip-version-check --no-cache-dir h11==0.14.0 anyio==4.4.0 sniffio==1.3.1 certifi==2024.2.2
          EOF
          docker build -t lattice-run357-oracle -f /tmp/run357.Dockerfile /tmp >run357-results/docker_build.log 2>&1 || true
          docker image inspect lattice-run357-oracle --format '{{.Id}}' >run357-results/docker_image_id.txt 2>&1 || true
          for arm in BASE IR PYTHON_AST; do
            if test "$arm" = BASE; then stage=/tmp/run357-httpcore; else stage="$(pwd)/run357-results/stages/$arm"; fi
            if test -d "$stage/httpcore"; then
              timeout 150 docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 768m --cpus 1 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=32m -e PYTHONPATH=/candidate -e PYTHONNOUSERSITE=1 -e PYTHONDONTWRITEBYTECODE=1 -e RUN340_SCOPE=MODEL_ISOLATED -e RUN340_ARM="$arm" -e RUN340_OUT=/tmp/records.json -v "$stage:/candidate:ro" -v "$(pwd)/research/K-SYNTH-1/run339/run340_public_api_oracle.py:/oracle/oracle.py:ro" --workdir /candidate lattice-run357-oracle sh -c 'python -B /oracle/oracle.py >/dev/null && cat /tmp/records.json' >"run357-results/oracle_$arm.json" 2>"run357-results/oracle_$arm.stderr" || true
            fi
          done
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('run357-results')
          def read(arm):
           try:return json.loads((root/f'oracle_{arm}.json').read_text())
           except Exception:return None
          base=read('BASE')
          qualified=bool(base and len(base['records'])==10 and sum(v['ok'] for v in base['records'])==6)
          out={'baseline_reproduced':qualified,'arms':{}}
          for arm in ('IR','PYTHON_AST'):
           o=read(arm)
           out['arms'][arm]={'oracle_completed':o is not None,'passed':sum(v['ok'] for v in o['records']) if o else None,'success':bool(qualified and o and len(o['records'])==10 and all(v['ok'] for v in o['records']))}
          (root/'functional_summary.json').write_text(json.dumps(out,indent=2)+'\n');print(out)
          PY
      - name: SHA-manifest all partial evidence
        if: always()
        shell: bash
        run: |
          python research/K-SYNTH-1/run357/run357_paired.py manifest /tmp/run357-httpcore run357-results || true
          python research/K-SYNTH-1/run357/run357_paired.py audit /tmp/run357-httpcore run357-results || true
      - name: Upload raw completions, compiler decisions, oracle traces and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-run357b-httpcore-original-qwen
          path: run357-results/
          retention-days: 90
          if-no-files-found: warn
