name: Lattice K-SYNTH-1 Run213 semantic safety
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - "research/K-SYNTH-1/run213/**"
      - ".github/workflows/lattice-k-synth-1-run213-semantic-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore SHA-preserved sources and verify 32 tests
        run: python research/K-SYNTH-1/run213/reproduce.py
