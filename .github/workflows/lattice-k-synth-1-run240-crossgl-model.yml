name: Lattice Run240 qualified CrossGL paired Qwen
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run240/*.zlib.b64'
      - '.github/workflows/lattice-k-synth-1-run240-crossgl-model.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lattice-run240-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualified-paired-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrossGL/crosstl
          ref: d456c2b5f509104dd97b74ce40c597531784e2ca
          path: upstream
          persist-credentials: false
      - name: Verify frozen runner, tests, and Run239 functional oracle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,pathlib,zlib
          expected={
            'research/K-SYNTH-1/run240/run240.py':'657b383727fb6fa39691bc23e7f3d338cae007abf7a99d5f1cb001ba5c612b5c',
            'research/K-SYNTH-1/run240/test_run240.py':'0e84e4c884941c74098605c591992baf8104e9a5e0c5060b29245832718d806e',
            'research/K-SYNTH-1/run239/qualify_crossgl.py':'232aaedbc91e279e77de2da68f7a303305054d5e8823329d1a569b7b523f5795',
          }
          for name,digest in expected.items():
              path=pathlib.Path(name)
              raw=zlib.decompress(base64.b64decode((path.with_name(path.name+'.zlib.b64')).read_text().strip()))
              assert hashlib.sha256(raw).hexdigest()==digest,(name,'source mismatch')
              path.write_bytes(raw)
          PY
          python -m unittest discover -s research/K-SYNTH-1/run240 -p test_run240.py -v
          mkdir -p run240-results
          git -C upstream rev-parse HEAD > run240-results/upstream_commit.txt
          git rev-parse HEAD > run240-results/lattice_commit.txt
          PYTHONPATH=research/K-SYNTH-1/run239 python research/K-SYNTH-1/run240/run240.py --repo upstream --out run240-results --freeze-only | tee run240-results/freeze_stdout.log
      - name: Build pinned llama.cpp CPU inference engine
        run: |
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = '620d2225cc436ab0b001e3200e590e3b286ef9ab'
          git -C /tmp/llama.cpp rev-parse HEAD > run240-results/llama_cpp_commit.txt
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build -j 2 --target llama-server
      - name: Download and SHA-verify open Qwen2.5-Coder-7B-Instruct
        run: |
          curl -fL --retry 3 --retry-all-errors -o /tmp/model.gguf 'https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf'
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  /tmp/model.gguf' | sha256sum -c -
      - name: Start common CPU inference server
        shell: bash
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/model.gguf --alias 'Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M' --host 127.0.0.1 --port 8080 -c 16384 -t 2 -np 1 > run240-results/llama.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health | grep -q 'ok' && exit 0
            sleep 2
          done
          tail -100 run240-results/llama.log
          exit 1
      - name: Run paired capable-model comparison and independent oracle
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=research/K-SYNTH-1/run239 python research/K-SYNTH-1/run240/run240.py --repo upstream --out run240-results | tee run240-results/inference_stdout.log
      - name: Preserve raw requests, responses, patches, traces and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-run240-crossgl-paired-qwen
          path: run240-results/
          retention-days: 90
          if-no-files-found: warn
