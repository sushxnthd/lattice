name: K-SYNTH-1 Run393 pinned urllib3 isolated socket oracle
on:
  push:
    branches: [research/exp003-context-order]
    paths: ['.github/workflows/k-synth-run393.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  socket-oracle:
    strategy:
      fail-fast: false
      matrix:
        variant: [base, connectionpool_only, poolmanager_only, full]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN393_VARIANT: ${{ matrix.variant }}
      RUN393_PAYLOAD: ""
    steps:
      - uses: actions/checkout@v4
        with:
          repository: urllib3/urllib3
          ref: e349d97f2bf234b95d5dd9e689d056a521dfc3b0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen sources, construct exact ablation and restore independent oracle
        shell: bash
        run: |
          mkdir -p run393_out
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,zlib
          root=pathlib.Path('upstream')
          frozen={'src/urllib3/connectionpool.py':'7556b50f6d685bdb30e7afac11484a05ef07b767','src/urllib3/poolmanager.py':'007b31dcfe8aae4f24bebff8bfafa1a06a7bd3eb'}
          def git(*args):
              return subprocess.check_output(['git','-C','upstream',*args]).decode().strip()
          for path,sha in frozen.items():
              actual=git('hash-object',path)
              assert actual==sha,(path,actual,sha)
          subprocess.run(['git','-C','upstream','fetch','--depth=1','origin','refs/pull/5126/head:refs/remotes/origin/run393ref'],check=True)
          head=git('rev-parse','refs/remotes/origin/run393ref')
          assert head=='580df2aab0340c2f81cf2770012875e4530a101d',head
          variant=os.environ['RUN393_VARIANT']
          for path in frozen:
              use=(variant=='full' or (variant=='connectionpool_only' and path.endswith('connectionpool.py')) or (variant=='poolmanager_only' and path.endswith('poolmanager.py')))
              if use:
                  blob=subprocess.check_output(['git','-C','upstream','show','refs/remotes/origin/run393ref:'+path])
                  (root/path).write_bytes(blob)
          script=zlib.decompress(base64.b64decode(os.environ['RUN393_PAYLOAD']))
          assert hashlib.sha256(script).hexdigest()=='036dff47bcbf96484d37bd98c08528b4671cd17d64aa6e7f7442696d5a43824b'
          pathlib.Path('run393_out/run393_socket_oracle.py').write_bytes(script)
          manifest={'variant':variant,'base':'e349d97f2bf234b95d5dd9e689d056a521dfc3b0','reference':'580df2aab0340c2f81cf2770012875e4530a101d','oracle_sha256':hashlib.sha256(script).hexdigest(),'sources':{p:git('hash-object',p) for p in frozen}}
          pathlib.Path('run393_out/source_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Execute isolated socket oracle, preserving raw outcomes
        shell: bash
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/upstream/src" python run393_out/run393_socket_oracle.py --out run393_out/outcomes.json
      - name: Generate artifact manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('run393_out')
          m={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*') if p.is_file()}
          (root/'artifact_sha256.json').write_text(json.dumps(m,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run393-${{ matrix.variant }}
          path: run393_out/
          if-no-files-found: warn
          retention-days: 30
