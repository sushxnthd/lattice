name: Lattice K-SYNTH-1 Run263 urllib3 diagnostic qualification
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - '.github/workflows/lattice-k-synth-1-run263-urllib3-diagnostics.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned six-ablation runner and checkout-only correction
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib,hashlib,pathlib
          p=pathlib.Path('research/K-SYNTH-1/run261/qualify_urllib3_5071.py.zlib.b64')
          raw=zlib.decompress(base64.b64decode(p.read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='59d598432bb2acc9a5715d869924394e65c0a02a168b70a60c70cae2779fb35a'
          s=raw.decode()
          old="""        cmd(['git','clone','--quiet','--filter=blob:none',REPO,str(src)])
                  cmd(['git','-C',str(src),'fetch','--quiet','origin',BASE,REF])
                  base=root/'base';ref=root/'ref'
                  cmd(['git','clone','--quiet','--no-hardlinks',str(src),str(base)])
                  cmd(['git','clone','--quiet','--no-hardlinks',str(src),str(ref)])
                  cmd(['git','-C',str(base),'checkout','--quiet',BASE])
                  cmd(['git','-C',str(ref),'checkout','--quiet',REF])
                  sha_base={p:sha(base/p) for p in FILES}
                  """.replace('                  ','        ').rstrip()+chr(10)
          new="""        # Checkout-only environmental correction, no changes to frozen tests.
                  cmd(['git','clone','--quiet',REPO,str(src)])
                  cmd(['git','-C',str(src),'fetch','--quiet','origin',BASE,REF])
                  base=root/'base';ref=root/'ref'
                  cmd(['git','-C',str(src),'worktree','add','--quiet','--detach',str(base),BASE])
                  cmd(['git','-C',str(src),'worktree','add','--quiet','--detach',str(ref),REF])
                  missing=[str(q) for q in [*(base/p for p in FILES),*(ref/p for p in FILES)] if not q.is_file()]
                  if missing:
                      raise RuntimeError('PINNED_SOURCE_MISSING_AFTER_WORKTREE '+json.dumps(missing))
                  sha_base={p:sha(base/p) for p in FILES}
                  """.replace('                  ','        ').rstrip()+chr(10)
          assert s.count(old)==1
          s=s.replace(old,new)
          assert hashlib.sha256(s.encode()).hexdigest()=='74e46f0c751853e6471255306318fcbc75a942c1b9a4dd432033b229708b39f6'
          pathlib.Path('run263_qualify.py').write_text(s)
          print('Verified runner 74e46f0c751853e6471255306318fcbc75a942c1b9a4dd432033b229708b39f6')
          PY
      - name: Execute unchanged frozen endpoints and preserve all six ablations
        shell: bash
        run: |
          mkdir -p run263_evidence
          export LATTICE_EVIDENCE_DIR="$GITHUB_WORKSPACE/run263_evidence"
          set +e
          python run263_qualify.py > run263_evidence/console.txt 2>&1
          status=$?
          set -e
          cat run263_evidence/console.txt
          echo "$status" > run263_evidence/exit_code.txt
          if test -f run263_evidence/qualification.json; then
            python - <<'PY'
          import json,pathlib
          q=json.loads(pathlib.Path('run263_evidence/qualification.json').read_text())
          print('PINNED_BASE_SHA',q['base_sha256'])
          print('PINNED_REF_SHA',q['reference_sha256'])
          for name,v in q['variants'].items():
              print('VARIANT',name,'returncode',v['returncode'],'checks',[(k,z.get('pass'),z.get('actual',z.get('exception'))) for k,z in (v.get('parsed') or {}).get('checks',{}).items()])
              if v.get('stderr'):print('STDERR',name,v['stderr'][-1200:])
          print('QUALIFIES',q['qualifies'])
          PY
          fi
          exit "$status"
      - name: Preserve qualification evidence even if negative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-run263-urllib3-5071-full-traces
          path: run263_evidence/
          if-no-files-found: warn
          retention-days: 30
