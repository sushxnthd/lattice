name: lattice-k-synth-1-capable-model-cpu
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run193/**'
      - '.github/workflows/lattice-k-synth-1-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lattice-k-synth-1-cpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semantic compiler and independent test dependencies
        run: python -m pip install -e . pytest
      - name: Restore exact prospective experiment source
        run: |
          python - <<'PY'
          import base64, zlib, hashlib, pathlib
          source = zlib.decompress(base64.b64decode(pathlib.Path('research/K-SYNTH-1/run193/runner.py.zlib.b64').read_text().strip()))
          assert hashlib.sha256(source).hexdigest() == '74c3ccbc5da6cfc7b902490c619d45f8b5d48bcf01d0d376a54cb796bb38d023'
          pathlib.Path('research/K-SYNTH-1/run193/run193_paired.py').write_bytes(source)
          PY
      - name: Freeze tasks and verify preregistered prompt hashes
        run: |
          python research/K-SYNTH-1/run193/run193_paired.py --out artifacts/freeze --shard 999 --shards 1000
          python - <<'PY'
          import json
          d=json.load(open('artifacts/freeze/manifest.json'))
          assert d['n']==258
          assert d['task_sha']=='f54d4c05b5176f18ecf187d57c144de3ec03b56fa80e7d3077517788f5eb06f7'
          assert d['prompts_sha']=='fa121f0dde370d61c6c5818023fdd9b5194c4b130995d38f06540e51b6dc6a03'
          PY
      - name: Build pinned llama.cpp CPU inference engine
        run: |
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build -j 2 --target llama-server
      - name: Download and verify open 7B coding model
        run: |
          curl -fL --retry 3 --retry-all-errors -o /tmp/model.gguf 'https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf'
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  /tmp/model.gguf' | sha256sum -c -
      - name: Start isolated CPU inference server
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/model.gguf --alias 'Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M' --host 127.0.0.1 --port 8080 -c 4096 -t 2 -np 1 > /tmp/llama.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health | grep -q 'ok' && exit 0
            sleep 2
          done
          cat /tmp/llama.log
          exit 1
      - name: Execute paired model completions with independent CPython checks
        run: |
          python research/K-SYNTH-1/run193/run193_paired.py --out artifacts/shard-${{ matrix.shard }} --shard ${{ matrix.shard }} --shards 8
      - name: Preserve raw prompts, model outputs, verifier traces and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-k-synth-1-run193-shard-${{ matrix.shard }}
          path: |
            artifacts/**
            /tmp/llama.log
          retention-days: 30
