name: Lattice K-SYNTH-1 Run430 historical HTTPX issue-first replay
on:
  push:
    branches:
      - research/exp003-context-order
    paths:
      - .github/workflows/lattice-k-synth-1-run430-historical.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-url-join:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install historical compatible HTTPX dependencies
        run: |
          python -m pip install --disable-pip-version-check 'rfc3986[idna2008]>=1.3,<2' 'httpcore>=0.15,<0.17' 'anyio>=3,<5' 'certifi' 'sniffio' 'idna' 'h11'
      - name: Execute exact first-parent and reference replay
        env:
          RUN430_OUT: run430_cloud_output
        run: |
          python research/K-SYNTH-1/run430/run430_historical_httpx.py | tee run430_runner_stdout.txt
      - name: Preserve original logs and SHA-256 manifest
        if: always()
        shell: bash
        run: |
          mkdir -p run430_cloud_output
          cp run430_runner_stdout.txt run430_cloud_output/ 2>/dev/null || true
          find run430_cloud_output -type f -print0 | sort -z | xargs -0 -r sha256sum > run430_cloud_output_sha256.txt
          cp run430_cloud_output_sha256.txt run430_cloud_output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lattice-run430-historical-httpx-original
          path: run430_cloud_output/
          if-no-files-found: warn
          retention-days: 90
