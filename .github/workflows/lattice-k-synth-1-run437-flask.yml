name: K-SYNTH-1 Run437 Flask historical component audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lattice-k-synth-1-run437-flask.yml'
jobs:
  historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp003-context-order
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install frozen historical test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mypy==0.910' 'Werkzeug==2.0.2' 'Jinja2==3.0.3' 'itsdangerous==2.0.1' 'click==8.0.4' 'MarkupSafe==2.0.1'
      - name: Historical Flask #4297 reference and component ablations
        shell: bash
        run: |
          set -o pipefail
          python research/K-SYNTH-1/run437/run437_cloud_probe.py 2>&1 | tee /tmp/lattice437_stdout.txt
      - name: Upload original raw receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-run437-flask4297-historical-raw
          path: |
            /tmp/lattice437/meta.json
            /tmp/lattice437/raw.jsonl
            /tmp/lattice437/sha256.json
            /tmp/lattice437_stdout.txt
            research/K-SYNTH-1/run437/run437_cloud_probe.py
            research/K-SYNTH-1/run437/RUN437_FLASK4297_PROSPECTIVE_FREEZE.md
          if-no-files-found: warn
          retention-days: 30
