name: K-SYNTH-1 Run426 issue-first Flask source qualification
on:
  push:
    branches:
      - research/exp003-context-order
    paths:
      - research/K-SYNTH-1/run426/**
      - .github/workflows/lattice-k-synth-1-run426-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-flask-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public Python runtime dependencies
        run: |
          python -m pip install 'Werkzeug==3.1.3' 'Jinja2==3.1.6' 'itsdangerous==2.2.0' 'click==8.1.8' 'blinker==1.9.0' 'MarkupSafe==3.0.3'
      - name: Recover exact immutable upstream Flask source
        run: |
          git clone --filter=blob:none https://github.com/pallets/flask.git /tmp/run426-flask
          git -C /tmp/run426-flask fetch origin 330123258e8c3dc391cbe55ab1ed94891ca83af3
          git -C /tmp/run426-flask fetch origin c2705ffd9ce1dc8476cb29eaf5ff5d4c719852d9
          git -C /tmp/run426-flask rev-parse 330123258e8c3dc391cbe55ab1ed94891ca83af3
          git -C /tmp/run426-flask rev-parse c2705ffd9ce1dc8476cb29eaf5ff5d4c719852d9
      - name: Execute frozen full-reference and leave-one-out isolated oracles
        run: |
          python research/K-SYNTH-1/run426/run426_cloud.py
          sha256sum run426_cloud_raw.json
      - name: Retain raw evidence including failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run426-flask-frozen-raw
          path: |
            run426_cloud_raw.json
            research/K-SYNTH-1/run426/run426_cloud.py
          if-no-files-found: warn
