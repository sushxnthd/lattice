name: Lattice K-SYNTH-1 Run214 CPython observability
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run214/**'
      - '.github/workflows/lattice-k-synth-1-run214-observability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observational-regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rebuild Run213 and execute six counterexamples plus 35 tests
        run: python research/K-SYNTH-1/run214/reproduce.py
      - name: Preserve independent CPython witness traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-run214-observability-${{ matrix.python-version }}
          path: research/K-SYNTH-1/run214/run214_ci_witnesses.json
          retention-days: 90
