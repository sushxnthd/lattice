name: Alpha package smoke (research)
on:
  push:
    branches: [research/exp003-context-order]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      - name: Fresh isolated install and end-to-end CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/lattice-alpha-smoke
          /tmp/lattice-alpha-smoke/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/lattice-alpha-smoke/bin/python -m lattice.framed_edits examples/framed-policy.json examples/expand-read.lattice --allow read --output /tmp/lattice-alpha-output.py
          /tmp/lattice-alpha-smoke/bin/python -m py_compile /tmp/lattice-alpha-output.py
      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q
