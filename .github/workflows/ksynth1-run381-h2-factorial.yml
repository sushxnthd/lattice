name: K-SYNTH-1 Run381 frozen HTTPcore H2 2x2 factorial
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - .github/workflows/ksynth1-run381-h2-factorial.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: encode/httpcore
          ref: eb5957d60b240a0deec503a4acca0e69da2833db
          path: upstream381
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact frozen oracle and original/ref Git blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run381-factorial
          python - <<'PY'
          import hashlib,pathlib,subprocess
          root='upstream381'
          def git(*args): return subprocess.check_output(['git','-C',root,*args],text=True).strip()
          assert git('rev-parse','HEAD')=='eb5957d60b240a0deec503a4acca0e69da2833db'
          oracle=pathlib.Path('research/K-SYNTH-1/run381/run381_h2_oracle.py')
          assert hashlib.sha256(oracle.read_bytes()).hexdigest()=='b5524eaed8dfaa3ff4b178b682909af5cfc09a52cfb99307c12377d78b625f2a'
          base={'httpcore/_sync/http2.py':'5cf43b298e6e8489bcb02d6f46ca897ddfae9afc','httpcore/_async/http2.py':'23701808b55371dda50678641660bcee47e2b95e'}
          ref={'httpcore/_sync/http2.py':'2e5fe4a3a2186bbeed88f2c5a5224aacdc3bbc55','httpcore/_async/http2.py':'af7c5b8ca64913f28d193f8409df3824168d0c6d'}
          for p,sha in base.items(): assert git('hash-object',p)==sha,(p,sha)
          for p,sha in ref.items(): assert git('rev-parse','aacdbb940d825987689f1798e5fa999a844da517:'+p)==sha,(p,sha)
          print('FROZEN_AND_REFERENCE_SHA_VERIFIED')
          PY
          python -m pip install --disable-pip-version-check sniffio==1.3.1 anyio==3.7.1 h11==0.14.0 certifi 'h2>=4,<5'
          python -m pip install --disable-pip-version-check --no-deps -e ./upstream381
      - name: Execute all four isolated exact-source configurations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,subprocess,shutil
          root=pathlib.Path('upstream381')
          out=pathlib.Path('run381-factorial')
          ref='aacdbb940d825987689f1798e5fa999a844da517'
          for name,sync,async_ in [('base',0,0),('sync_only',1,0),('async_only',0,1),('full',1,1)]:
              target=out/name
              shutil.copytree(root/'httpcore',target/'httpcore')
              for kind,active in [('sync',sync),('async',async_)]:
                  if active:
                      p='httpcore/_'+kind+'/http2.py'
                      content=subprocess.check_output(['git','-C',str(root),'show',ref+':'+p])
                      (target/p).write_bytes(content)
          PY
          for arm in base sync_only async_only full; do
            set +e
            PYTHONPATH="{{ github.workspace }}/run381-factorial/$arm" timeout 90s python research/K-SYNTH-1/run381/run381_h2_oracle.py > "run381-factorial/{arm}.json" 2> "run381-factorial/{arm}.stderr"
            rc=$?
            set -e
            echo "$rc" > "run381-factorial/{arm}.exit"
          done
          python - <<'PY'
          import json,hashlib,pathlib
          d=pathlib.Path('run381-factorial')
          report={'schema':1,'base':'eb5957d60b240a0deec503a4acca0e69da2833db','reference':'aacdbb940d825987689f1798e5fa999a844da517','arms':{}}
          for name in ['base','sync_only','async_only','full']:
              data=(d/(name+'.json')).read_bytes()
              observations=json.loads(data)['observations']
              assert len(observations)==12
              report['arms'][name]={'raw_sha256':hashlib.sha256(data).hexdigest(),'target_pass':sum(x['pass'] for x in observations if x['role']=='target'),'control_pass':sum(x['pass'] for x in observations if x['role']=='control'),'outcomes':[{'kind':x['kind'],'case':x['case'],'pass':x['pass']} for x in observations]}
          expected={'base':(0,8),'sync_only':(2,8),'async_only':(2,8),'full':(4,8)}
          report['prospective_qualifies']=all((v['target_pass'],v['control_pass'])==expected[k] for k,v in report['arms'].items())
          (d/'summary.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run381-httpcore-h2-original-factorial
          path: run381-factorial/
          if-no-files-found: warn
