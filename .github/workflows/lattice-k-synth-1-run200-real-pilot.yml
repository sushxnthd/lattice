name: lattice-k-synth-1-run200-real-pilot
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run200/**'
      - '.github/workflows/lattice-k-synth-1-run200-real-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lattice-k-synth-1-run200-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-real-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned runner and compiler sources
        run: |
          python - <<'PY'
          import pathlib,hashlib,base64,zlib
          root=pathlib.Path('research/K-SYNTH-1/run200')
          checks={
            'multifile_editor.py':'097e61f2303860775f1ac0cf82d19e47a7ff3d4fc8f83be15c20b12f86145a6d',
            'representation.py':'dd3d49dc6c0675deaf262c9e9bf8c124d416281a4ba2e14f57ca39a272131b72',
            'real_pilot.py':'5930f3d53c99f9a8af9776b3b78b83ed0b6b62e54163b1129b14c32bbf2d0ae8'}
          for name,expected in checks.items():
            source=zlib.decompress(base64.b64decode((root/(name+'.zlib.b64')).read_text().strip()))
            observed=hashlib.sha256(source).hexdigest()
            assert observed==expected,(name,observed,expected)
            (root/name).write_bytes(source)
          PY
          python -m py_compile research/K-SYNTH-1/run200/*.py
      - name: Restore independently frozen 480-task public manifest only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/run200 /tmp/run199-public
          gh run download 39971628595 --repo sushxnthd/lattice --name lattice-run199-v2-public --dir /tmp/run199-public
          python - <<'PY'
          from pathlib import Path
          import hashlib,shutil
          files=list(Path('/tmp/run199-public').rglob('public.json'))
          assert len(files)==1,files
          data=files[0].read_bytes()
          assert hashlib.sha256(data).hexdigest()=='f615b8c5f4f7e4b1996992105515b3e15e9678fb57a3cc0cff5cf1aef64641f2'
          shutil.copyfile(files[0],'artifacts/run200/public.json')
          PY
      - name: Freeze real-issue pilot before model inference
        run: |
          python research/K-SYNTH-1/run200/real_pilot.py --public artifacts/run200/public.json --out artifacts/run200/freeze --freeze-only
          python - <<'PY'
          import json
          m=json.load(open('artifacts/run200/freeze/freeze.json'))
          assert m['issue_ids']==['getmoto__moto-7211','scrapy__scrapy-6469']
          PY
      - name: Build pinned CPU inference engine
        run: |
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build -j 2 --target llama-server
      - name: Download and verify open 7B coding model
        run: |
          curl -fL --retry 3 --retry-all-errors -o /tmp/model.gguf 'https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf'
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  /tmp/model.gguf' | sha256sum -c -
      - name: Start CPU inference server
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/model.gguf --alias 'Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M' --host 127.0.0.1 --port 8080 -c 8192 -t 2 -np 1 > /tmp/lattice-run200-llama.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health | grep -q 'ok' && exit 0
            sleep 2
          done
          cat /tmp/lattice-run200-llama.log
          exit 1
      - name: Execute positive controls and paired real-issue pilot
        run: |
          python research/K-SYNTH-1/run200/real_pilot.py --public artifacts/run200/public.json --out artifacts/run200/inference
      - name: Preserve exact requests, raw model responses and verifier failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-k-synth-1-run200-raw
          path: |
            artifacts/run200/**
            /tmp/lattice-run200-llama.log
          retention-days: 90
