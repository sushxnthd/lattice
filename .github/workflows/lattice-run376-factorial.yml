name: K-SYNTH-1 Run376 exact PR680 factorial qualification
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run376/**'
      - '.github/workflows/lattice-run376-factorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: encode/httpcore
          ref: 5e06a9bb99a05bfc20f3e0cdb1b969967ae1dc4e
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install original historical dependencies
        run: |
          python -m pip install sniffio==1.3.1 anyio==3.7.1 h11==0.14.0 certifi
          python -m pip install --no-deps -e ./upstream
      - name: Exact two-file reference and heldout factorial
        shell: bash
        run: |
          mkdir -p run376-factorial-results
          set +e
          timeout 120s python research/K-SYNTH-1/run376/run376_factorial_runner.py > run376-factorial-results/stdout.txt 2> run376-factorial-results/stderr.txt
          rc=$?
          echo "$rc" > run376-factorial-results/exit_code.txt
          cat run376-factorial-results/stdout.txt
          cat run376-factorial-results/stderr.txt
          test "$rc" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run376-httpcore-pr680-four-arm
          path: run376-factorial-results/
          if-no-files-found: warn
