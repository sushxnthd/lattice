name: Lattice K-SYNTH-1 Run279 HTTPcore prospective qualification
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run279/LAUNCH_RUN279.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  httpcore-prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore frozen SHA-pinned source transport
        run: |
          python - <<'PYRESTORE'
          import base64, hashlib, io, pathlib, tarfile, zlib
          root=pathlib.Path('research/K-SYNTH-1/run279')
          compressed=base64.b64decode((root/'run279_frozen_sources.tar.zlib.b64').read_text())
          assert hashlib.sha256(compressed).hexdigest()=='d7c71fac1cc9272ef6f62fa9bd8e36260f1fe748634ec9fa1d59e65dfed3a923'
          with tarfile.open(fileobj=io.BytesIO(zlib.decompress(compressed))) as archive:
              for member in archive.getmembers():
                  assert member.name in {'run279_httpcore_1000_qualify.py','idle_cardinality_ir.py','test_run279_freeze.py','test_idle_cardinality_ir.py','FROZEN_RUN279.json','RUN279_SHA256SUMS'}
                  assert member.isfile() and '/' not in member.name
                  (root/member.name).write_bytes(archive.extractfile(member).read())
          PYRESTORE
      - name: Verify frozen research code
        run: sha256sum -c research/K-SYNTH-1/run279/RUN279_SHA256SUMS
      - name: Local freeze and IR tests
        run: |
          cd research/K-SYNTH-1/run279
          python -m unittest -v test_run279_freeze.py test_idle_cardinality_ir.py
      - name: Install pinned-free functional dependencies
        run: |
          python -m pip install 'h11>=0.14,<1' 'h2>=4,<5' 'sniffio>=1,<2'
          python -m pip freeze > research/K-SYNTH-1/run279/cloud_dependencies.txt
      - name: Restore exact direct-parent upstream sources
        run: |
          git clone --quiet https://github.com/encode/httpcore.git "$RUNNER_TEMP/httpcore-base"
          git -C "$RUNNER_TEMP/httpcore-base" checkout --quiet --detach 5974b03c7df89d3ee4e23779900d5349d550753c
          git -C "$RUNNER_TEMP/httpcore-base" worktree add --quiet --detach "$RUNNER_TEMP/httpcore-ref" 7fb20526175e2300185ce2b472a97acca95b2525
          test "$(git -C "$RUNNER_TEMP/httpcore-ref" rev-parse HEAD^)" = 5974b03c7df89d3ee4e23779900d5349d550753c
      - name: Run prospectively frozen 4 x 10 independent public API oracle
        run: |
          python research/K-SYNTH-1/run279/run279_httpcore_1000_qualify.py --base "$RUNNER_TEMP/httpcore-base" --ref "$RUNNER_TEMP/httpcore-ref" --out "$RUNNER_TEMP/run279-results"
          cp research/K-SYNTH-1/run279/FROZEN_RUN279.json "$RUNNER_TEMP/run279-results/"
          cp research/K-SYNTH-1/run279/cloud_dependencies.txt "$RUNNER_TEMP/run279-results/"
          cp research/K-SYNTH-1/run279/RUN279_SHA256SUMS "$RUNNER_TEMP/run279-results/"
          (cd "$RUNNER_TEMP/run279-results" && sha256sum * > ARTIFACT_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run279-httpcore1000-original-qualification
          path: ${{ runner.temp }}/run279-results/
          if-no-files-found: warn
          retention-days: 30
