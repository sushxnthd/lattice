name: lattice-k-synth-1-snapshot-alias-factorial
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run196/**'
      - '.github/workflows/lattice-k-synth-1-snapshot-alias.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lattice-k-synth-1-alias-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production compiler and tests
        run: python -m pip install -e . pytest
      - name: Restore SHA-pinned historical runners and prospective experiment
        run: |
          python - <<'PY'
          import base64,zlib,hashlib,pathlib
          checks=[
            ('research/K-SYNTH-1/run193','run193_paired.py','74c3ccbc5da6cfc7b902490c619d45f8b5d48bcf01d0d376a54cb796bb38d023'),
            ('research/K-SYNTH-1/run195','run195_format_pilot.py','e2cb8f93c5613c95385a4dacf5eaa5af112e2816614c7dbb2017649655710085'),
            ('research/K-SYNTH-1/run196','run196_alias_pilot.py','b08497eb28010e9103136693fe0fe6dfa3b1bb8438127a028276d987634e635d'),
          ]
          for folder,name,expected in checks:
            path=pathlib.Path(folder)
            source=zlib.decompress(base64.b64decode((path/'runner.py.zlib.b64').read_text().strip()))
            assert hashlib.sha256(source).hexdigest()==expected, (folder,name)
            (path/name).write_bytes(source)
          PY
      - name: Freeze prospective prompts and reference controls
        env:
          PYTHONPATH: research/K-SYNTH-1/run193:research/K-SYNTH-1/run195:research/K-SYNTH-1/run196
        run: |
          python research/K-SYNTH-1/run196/run196_alias_pilot.py --out artifacts/freeze --freeze-only
          python - <<'PY'
          import json
          d=json.load(open('artifacts/freeze/manifest.json'))
          assert d['prompts_sha256']=='66cfba6c50c40590b459bda34a1adcb029bca65e9132e5d607e547b002eb45ba'
          assert len(d['reference_passes'])==16 and set(d['reference_passes'].values())=={'pass'}
          PY
      - name: Build pinned CPU inference engine
        run: |
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build -j 2 --target llama-server
      - name: Download and verify no-cost open coding model
        run: |
          curl -fL --retry 3 --retry-all-errors -o /tmp/model.gguf 'https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf'
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  /tmp/model.gguf' | sha256sum -c -
      - name: Start local CPU inference server
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/model.gguf --alias 'Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M' --host 127.0.0.1 --port 8080 -c 4096 -t 2 -np 1 > /tmp/llama.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health | grep -q 'ok' && exit 0
            sleep 2
          done
          cat /tmp/llama.log
          exit 1
      - name: Run gated prospective 2x2 model experiment
        env:
          PYTHONPATH: research/K-SYNTH-1/run193:research/K-SYNTH-1/run195:research/K-SYNTH-1/run196
        run: |
          python research/K-SYNTH-1/run196/run196_alias_pilot.py --out artifacts/shard-${{ matrix.shard }} --shard ${{ matrix.shard }} --shards 4
      - name: Retain raw requests, responses, verifier traces and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-k-synth-1-run196-shard-${{ matrix.shard }}
          path: |
            artifacts/shard-${{ matrix.shard }}/
            artifacts/freeze/
            /tmp/llama.log
          retention-days: 30
