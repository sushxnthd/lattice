name: structured-topology-control-v1
on:
  workflow_dispatch:
  push:
    branches: [research/structured-topology-control-v1]
    paths:
      - ".github/workflows/structured-topology-control-v1.yml"
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - run: python -m pip install "transformers>=4.45,<5"
      - run: python experiments/structured_topology_control_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-topology-control-v1
          path: artifacts/
