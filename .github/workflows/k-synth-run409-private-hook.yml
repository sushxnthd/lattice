name: K-SYNTH-1 Run409 private-hook scope counterexample
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - .github/workflows/k-synth-run409-private-hook.yml
  workflow_dispatch:
jobs:
  post-outcome-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [control903, regression911]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout and install exact pytest source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.source }}" = "control903" ]; then
            SHA=a7d58d7a21b78581e636bbbdea13c66ad1657c1e
          else
            SHA=cf470ec0bf7eb89cd97dd56df4859eae5db46447
          fi
          git clone --quiet https://github.com/pytest-dev/pytest.git /tmp/lattice-pytest
          git -C /tmp/lattice-pytest checkout --detach "$SHA"
          test "$(git -C /tmp/lattice-pytest rev-parse HEAD)" = "$SHA"
          echo "PINNED_SHA=$SHA" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check /tmp/lattice-pytest
      - name: Run two post-outcome private-hook scope controls
        shell: bash
        run: |
          python research/K-SYNTH-1/run409/run409_private_hook_scope.py
      - name: Attest installed Python source against pinned checkout
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('research/K-SYNTH-1/run409')
          data={'pinned_checkout':'/tmp/lattice-pytest','installed_module_tree_matches':False}
          try:
              import pytest
              root=pathlib.Path(pytest.__file__).resolve().parent.parent
              checkout=pathlib.Path('/tmp/lattice-pytest/src')
              entries=[]
              for package in ('_pytest','pytest'):
                  src=checkout/package;dst=root/package
                  for f in sorted(src.rglob('*.py')):
                      rel=f.relative_to(checkout);target=dst/f.relative_to(src)
                      a=hashlib.sha256(f.read_bytes()).hexdigest()
                      b=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
                      entries.append({'path':str(rel),'checkout_sha256':a,'installed_sha256':b,'match':a==b})
              data.update({'installed_root':str(root),'files_checked':len(entries),
                           'mismatches':[e for e in entries if not e['match']],
                           'installed_module_tree_matches':bool(entries) and all(e['match'] for e in entries),
                           'source_file_manifest':entries})
          except Exception as e:data['attestation_error']=repr(e)
          (p/'run409_installed_source_attestation.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps({k:v for k,v in data.items() if k!='source_file_manifest'},indent=2))
          assert data['installed_module_tree_matches'],'PINNED_INSTALLED_SOURCE_MISMATCH'
          PY
      - name: Preserve source, environment and original stdout/stderr
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess,sys
          p=pathlib.Path('research/K-SYNTH-1/run409')
          files=list(p.glob('run409_hook_scope_*.json'))+[p/'run409_private_hook_scope.py']
          h=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          try:
              import pytest
              ver=pytest.__version__
              path=pytest.__file__
          except Exception as e:
              ver='IMPORT_ERROR:'+repr(e);path=None
          out={'matrix_source':'${{ matrix.source }}','pinned_sha':os.environ.get('PINNED_SHA'),
               'git_head':subprocess.run(['git','-C','/tmp/lattice-pytest','rev-parse','HEAD'],
                   capture_output=True,text=True).stdout.strip(),
               'python':sys.version,'platform':platform.platform(),'pytest_version':ver,
               'pytest_path':path,'files_sha256':{x.name:h(x) for x in files if x.exists()}}
          (p/'run409_cloud_environment.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Upload evidence even on diagnostic failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run409-private-hook-${{ matrix.source }}
          path: |
            research/K-SYNTH-1/run409/run409_private_hook_scope.py
            research/K-SYNTH-1/run409/run409_hook_scope_*.json
            research/K-SYNTH-1/run409/run409_cloud_environment.json
            research/K-SYNTH-1/run409/run409_installed_source_attestation.json
          if-no-files-found: warn
          retention-days: 30
