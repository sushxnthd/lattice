name: Lattice Run332 corrected AST and two-action gate paired Qwen pilot
on:
  push:
    branches: [research/exp003-context-order]
    paths: ['.github/workflows/lattice-k-synth-1-run332-httpx-paired.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lattice-run332-httpx-paired
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify code, pin baseline, freeze requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run332-results
          echo '4f74ec579c637a24e6fa08257ec619882d7c13cbf1a2b92dca1958a7565ccb45  research/K-SYNTH-1/run329/run329_real_code.tar.zlib.b64' | sha256sum -c -
          python - <<'PY'
          import base64,io,pathlib,tarfile,zlib
          root=pathlib.Path('research/K-SYNTH-1/run329')
          packed=base64.b64decode((root/'run329_real_code.tar.zlib.b64').read_text())
          with tarfile.open(fileobj=io.BytesIO(zlib.decompress(packed))) as tar:
           matches=[m for m in tar.getmembers() if m.name=='run329_signature_editor.py' and m.isfile() and m.size<20000]
           assert len(matches)==1
           (root/'run329_signature_editor.py').write_bytes(tar.extractfile(matches[0]).read())
          PY
          echo '2586f08bf0bbc47e109f77b136f790ca70feab12359fb7d60eb170069f33d817  research/K-SYNTH-1/run330/run330_paired_httpx.py' | sha256sum -c -
          echo 'f5f4e538999df7cac966d701d849c1e58f8e8721d1991a2662fb8374ce44e340  research/K-SYNTH-1/run329/run329_signature_editor.py' | sha256sum -c -
          echo '02ee9ea526a90e5c3c31bac0d9078a40d963a7296b50ca6db19301b6694e408c  research/K-SYNTH-1/run329/run329_postfreeze_boolean_guard.py' | sha256sum -c -
          echo '51cefba11ede1692bf543500f410fcf3406f95705f6b5876af886893574394f7  research/K-SYNTH-1/run328/run328_oracle.py' | sha256sum -c -
          echo '0b8eeba574bb589457ed026aec6bcf3ae8048065362c63754d4c933fceabd73c  research/K-SYNTH-1/run332/run332_paired_httpx.py' | sha256sum -c -
          echo '648d54480f5fc1a0714f3f1e1c83abc2e4082bd3ac9769f2055a110113aa1085  research/K-SYNTH-1/run332/run332_independent_contract_audit.py' | sha256sum -c -
          python -m py_compile research/K-SYNTH-1/run332/run332_paired_httpx.py
          git rev-parse HEAD > run332-results/lattice_commit.txt
          git clone https://github.com/encode/httpx.git /tmp/run332-httpx
          git -C /tmp/run332-httpx checkout --detach 891d865044d27c229278f0fa20d84ba4007cb289
          test "$(git -C /tmp/run332-httpx rev-parse HEAD)" = 891d865044d27c229278f0fa20d84ba4007cb289
          test "$(git -C /tmp/run332-httpx rev-parse HEAD:httpx/_api.py)" = a300f633e7ace1d0876a39735bf9af0c7ac64336
          test "$(git -C /tmp/run332-httpx rev-parse HEAD:httpx/_client.py)" = e3b2f5b31913f210491a6c5fc2bff1c454833440
          PYTHONPATH=research/K-SYNTH-1/run329:research/K-SYNTH-1/run330 python research/K-SYNTH-1/run332/run332_paired_httpx.py freeze /tmp/run332-httpx run332-results | tee run332-results/freeze_stdout.txt
      - name: Independently verify all frozen candidate AST slots and requests
        shell: bash
        run: |
          set -euo pipefail
          python research/K-SYNTH-1/run332/run332_independent_contract_audit.py /tmp/run332-httpx run332-results | tee run332-results/independent_freeze_audit.json
      - name: Build pinned llama.cpp and download SHA-pinned Qwen 7B
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git /tmp/run332-llama
          test "$(git -C /tmp/run332-llama rev-parse HEAD)" = 620d2225cc436ab0b001e3200e590e3b286ef9ab
          git -C /tmp/run332-llama rev-parse HEAD > run332-results/llama_commit.txt
          cmake -S /tmp/run332-llama -B /tmp/run332-llama/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/run332-llama/build -j 2 --target llama-server
          curl -fL --retry 3 --retry-all-errors -o /tmp/run332-model.gguf https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  /tmp/run332-model.gguf' | sha256sum -c -
      - name: Start server, verify budgets, run gated genuine inference
        shell: bash
        run: |
          set -uo pipefail
          /tmp/run332-llama/build/bin/llama-server -m /tmp/run332-model.gguf --alias Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M --host 127.0.0.1 --port 8080 -c 16384 -t 2 -np 1 > run332-results/llama.log 2>&1 &
          for i in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8080/health | grep -q ok && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          python - <<'PY'
          import json,pathlib,urllib.request
          root=pathlib.Path('run332-results'); rows=[]
          for kind in ('GATE','REAL'):
           for arm in ('IR','PYTHON_AST'):
            name=kind+'_'+arm;r=json.loads((root/('request_'+name+'.json')).read_text())
            req=urllib.request.Request('http://127.0.0.1:8080/tokenize',data=json.dumps({'content':r['messages'][0]['content']}).encode(),headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=180) as response:n=len(json.load(response)['tokens'])
            rows.append({'request':name,'prompt_tokens':n,'completion_budget':768})
            assert n+768<16384,(name,n,'PRECOMPLETION_CONTEXT_OVERFLOW')
          (root/'token_budget.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          for arm in IR PYTHON_AST; do
            PYTHONPATH=research/K-SYNTH-1/run329:research/K-SYNTH-1/run330 python research/K-SYNTH-1/run332/run332_paired_httpx.py infer run332-results "GATE_$arm" || true
            PYTHONPATH=research/K-SYNTH-1/run329:research/K-SYNTH-1/run330 python research/K-SYNTH-1/run332/run332_paired_httpx.py compile /tmp/run332-httpx run332-results "GATE_$arm" || true
          done
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('run332-results'); gates={}
          for arm in ('IR','PYTHON_AST'):
           try:
            v=json.loads((root/('compile_GATE_'+arm+'.json')).read_text())
            gates[arm]=bool(v.get('accepted') and v.get('gate_pass'))
           except Exception:gates[arm]=False
          (root/'gate_summary.json').write_text(json.dumps({'gates':gates,'both_pass':all(gates.values())},indent=2)+'\n')
          print(gates)
          PY
          if python -c "import json; assert json.load(open('run332-results/gate_summary.json'))['both_pass']"; then
            for arm in IR PYTHON_AST; do
              PYTHONPATH=research/K-SYNTH-1/run329:research/K-SYNTH-1/run330 python research/K-SYNTH-1/run332/run332_paired_httpx.py infer run332-results "REAL_$arm" || true
              PYTHONPATH=research/K-SYNTH-1/run329:research/K-SYNTH-1/run330 python research/K-SYNTH-1/run332/run332_paired_httpx.py compile /tmp/run332-httpx run332-results "REAL_$arm" || true
            done
          else
            echo 'PREDECLARED_GATE_FAILURE: real inference not attempted' | tee run332-results/gate_failure.txt
          fi
      - name: Build dependency image and evaluate untrusted patches in isolated Docker
        shell: bash
        run: |
          set -uo pipefail
          cat > /tmp/run332.Dockerfile <<'EOF'
          FROM python:3.8-slim
          RUN pip install --disable-pip-version-check --no-cache-dir httpcore==0.10.2 rfc3986==1.5.0 chardet==3.0.4 idna==2.10 certifi sniffio
          EOF
          docker build -t lattice-run332-oracle -f /tmp/run332.Dockerfile /tmp
          docker image inspect lattice-run332-oracle --format '{{.Id}}' > run332-results/oracle_image_id.txt
          for arm in BASE IR PYTHON_AST; do
            if test "$arm" = BASE; then stage=/tmp/run332-httpx; else stage="$(pwd)/run332-results/stages/$arm"; fi
            if test -d "$stage/httpx"; then
              timeout 120 docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 768m --cpus 1 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=32m -e PYTHONPATH=/candidate -e PYTHONNOUSERSITE=1 -e PYTHONDONTWRITEBYTECODE=1 -v "$stage:/candidate:ro" -v "$(pwd)/research/K-SYNTH-1/run328/run328_oracle.py:/oracle/oracle.py:ro" --workdir /candidate lattice-run332-oracle python -B /oracle/oracle.py > "run332-results/oracle_$arm.json" 2> "run332-results/oracle_$arm.stderr" || true
            fi
          done
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('run332-results')
          def read(name):
           try:return json.loads((root/('oracle_'+name+'.json')).read_text())
           except Exception:return None
          b=read('BASE'); qualified=bool(b and b.get('schema')=='lattice-run328-oracle-v1' and len(b.get('cases',[]))==9 and sum(c['passed'] for c in b['cases'][:3])==0 and all(c['passed'] for c in b['cases'][3:]))
          result={'baseline_oracle_reproduced':qualified,'baseline':b,'arms':{}}
          for arm in ('IR','PYTHON_AST'):
           o=read(arm)
           result['arms'][arm]={'oracle_completed':o is not None,'success':bool(qualified and o and o.get('passed')==9),'raw_oracle':o}
          (root/'functional_summary.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('BASE_REPRODUCED',qualified,'PAIRED',[(k,v['success']) for k,v in result['arms'].items()])
          PY
      - name: SHA-256 manifest, including partial failures
        if: always()
        shell: bash
        run: |
          PYTHONPATH=research/K-SYNTH-1/run329:research/K-SYNTH-1/run330 python research/K-SYNTH-1/run332/run332_paired_httpx.py manifest run332-results
      - name: Upload exact requests, raw completions and oracle traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-run332-corrected-ast-two-action-qwen
          path: run332-results/
          retention-days: 90
          if-no-files-found: warn
