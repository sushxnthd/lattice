name: K-SYNTH-1 Run376 frozen HTTPcore race qualification
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run376/**'
      - '.github/workflows/lattice-run376-httpcore.yml'
      - 'research/K-SYNTH-1/run381/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Lattice evidence branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact issue-linked upstream commit
        uses: actions/checkout@v4
        with:
          repository: encode/httpcore
          ref: 5e06a9bb99a05bfc20f3e0cdb1b969967ae1dc4e
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned historical package in isolated runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install sniffio==1.3.1 anyio==3.7.1 h11==0.14.0 certifi
          python -m pip install --no-deps -e ./upstream
      - name: Execute original frozen public tests without network I/O
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream
        run: |
          mkdir -p run376-results
          set +e
          timeout 60s python research/K-SYNTH-1/run376/run376_historical_oracle.py --upstream upstream --phase public --out run376-results/public.json > run376-results/stdout.txt 2> run376-results/stderr.txt
          rc=$?
          echo "$rc" > run376-results/exit_code.txt
          cat run376-results/stdout.txt
          cat run376-results/stderr.txt
          test "$rc" -eq 0
      - name: Upload original evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run376-httpcore-original-public
          path: run376-results/
          if-no-files-found: warn

  run381-h2-frozen-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: encode/httpcore
          ref: eb5957d60b240a0deec503a4acca0e69da2833db
          path: upstream381
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and frozen oracle
        run: |
          mkdir -p run381-results
          python - <<'PY'
          import hashlib,pathlib,subprocess
          f=pathlib.Path('research/K-SYNTH-1/run381/run381_h2_oracle.py')
          assert hashlib.sha256(f.read_bytes()).hexdigest()=='b5524eaed8dfaa3ff4b178b682909af5cfc09a52cfb99307c12377d78b625f2a'
          root='upstream381'
          for path,expected in [('httpcore/_sync/http2.py','5cf43b298e6e8489bcb02d6f46ca897ddfae9afc'),('httpcore/_async/http2.py','23701808b55371dda50678641660bcee47e2b95e')]:
              assert subprocess.check_output(['git','-C',root,'hash-object',path],text=True).strip()==expected
          assert subprocess.check_output(['git','-C',root,'rev-parse','HEAD'],text=True).strip()=='eb5957d60b240a0deec503a4acca0e69da2833db'
          PY
      - name: Install isolated historical package
        run: |
          python -m pip install --disable-pip-version-check sniffio==1.3.1 anyio==3.7.1 h11==0.14.0 certifi 'h2>=4,<5'
          python -m pip install --disable-pip-version-check --no-deps -e ./upstream381
      - name: Run original H2 wire-level oracle
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream381
        run: |
          set +e
          timeout 90s python research/K-SYNTH-1/run381/run381_h2_oracle.py > run381-results/raw.json 2> run381-results/stderr.txt
          rc=$?
          echo "$rc" > run381-results/exit.txt
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('run381-results')
          result={'schema':1,'base':'eb5957d60b240a0deec503a4acca0e69da2833db','raw_sha256':hashlib.sha256((p/'raw.json').read_bytes()).hexdigest(),'exit':int((p/'exit.txt').read_text())}
          try:
              rows=json.loads((p/'raw.json').read_text())['observations']
              result['target_pass']=sum(x['pass'] for x in rows if x['role']=='target')
              result['control_pass']=sum(x['pass'] for x in rows if x['role']=='control')
              result['cases']=[{'kind':x['kind'],'case':x['case'],'pass':x['pass'],'error':x.get('error')} for x in rows]
              result['baseline_qualifies']=len(rows)==12 and result['target_pass']==0 and result['control_pass']==8
          except Exception as e: result['error']=repr(e);result['baseline_qualifies']=False
          (p/'summary.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run381-httpcore-h2-frozen-baseline
          path: run381-results/
          if-no-files-found: warn
