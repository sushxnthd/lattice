name: K-SYNTH-1 Run376 frozen HTTPcore race qualification
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run376/**'
      - '.github/workflows/lattice-run376-httpcore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Lattice evidence branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact issue-linked upstream commit
        uses: actions/checkout@v4
        with:
          repository: encode/httpcore
          ref: 5e06a9bb99a05bfc20f3e0cdb1b969967ae1dc4e
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned historical package in isolated runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install sniffio==1.3.1 anyio==3.7.1 h11==0.14.0 certifi
          python -m pip install --no-deps -e ./upstream
      - name: Execute original frozen public tests without network I/O
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream
        run: |
          mkdir -p run376-results
          set +e
          timeout 60s python research/K-SYNTH-1/run376/run376_historical_oracle.py --upstream upstream --phase public --out run376-results/public.json > run376-results/stdout.txt 2> run376-results/stderr.txt
          rc=$?
          echo "$rc" > run376-results/exit_code.txt
          cat run376-results/stdout.txt
          cat run376-results/stderr.txt
          test "$rc" -eq 0
      - name: Upload original evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run376-httpcore-original-public
          path: run376-results/
          if-no-files-found: warn
