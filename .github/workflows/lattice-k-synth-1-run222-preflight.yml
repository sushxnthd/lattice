name: Lattice K-SYNTH-1 Run222 three-repository preflight-gate falsification
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run222/**'
      - '.github/workflows/lattice-k-synth-1-run222-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lattice-k-synth-1-run222-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-preflight-falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        task_index: [2, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned compiler, model interfaces and frozen Run220 discovery cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd research/K-SYNTH-1/run207
          python - <<'PY'
          import base64,pathlib,zlib
          for name in ('repo_transaction.py','paired_repo_pilot.py'):
              p=pathlib.Path(name+'.zlib.b64')
              pathlib.Path(name).write_bytes(zlib.decompress(base64.b64decode(p.read_text().strip())))
          PY
          base64 -d ../run208/run208_runner_patch.gz.b64 | gzip -d | patch -p1 --batch
          base64 -d ../run209/run209_runner_patch.gz.b64 | gzip -d | patch -p1 --batch
          base64 -d ../run210/run210_runner_patch.gz.b64 | gzip -d | patch -p1 --batch
          cp ../run217/run217_matched_pilot.py .
          cp ../run218/run218.py ../run218/test_run218.py .
          cp ../run220/run220.py ../run220/test_run220.py .
          cp ../run222/run222.py ../run222/test_run222.py .
          mkdir -p /tmp/lattice-run220-public
          gh run download 39971628595 --repo sushxnthd/lattice --name lattice-run199-v2-public --dir /tmp/lattice-run220-public
          python - <<'PY'
          import pathlib,hashlib,json
          paths=list(pathlib.Path('/tmp/lattice-run220-public').rglob('public.json'))
          assert len(paths)==1
          data=paths[0].read_bytes()
          assert hashlib.sha256(data).hexdigest()=='f615b8c5f4f7e4b1996992105515b3e15e9678fb57a3cc0cff5cf1aef64641f2'
          public=json.loads(data)
          ids=("datadog__guarddog-419","gridtools__gt4py-1411",
               "marketsquare__robotframework-robocop-1329","qchackers__tqec-376",
               "spikeinterface__spikeinterface-3778","jlowin__fastmcp-317",
               "pybamm-team__pybamm-3795","googlecloudplatform__cloud-sql-python-connector-1201")
          cohort=[next(r for r in public if r['instance_id']==i) for i in ids]
          assert len({r['repo'] for r in cohort})==8 and all(r['split']=='discovery' for r in cohort)
          pathlib.Path('cohort.json').write_text(json.dumps(cohort,indent=2,sort_keys=True)+'\n')
          assert hashlib.sha256(pathlib.Path('cohort.json').read_bytes()).hexdigest()=='e262048bb9785bb1774b4d9e0a76654e928d7b647af144edf29379d8976fa686'
          PY
          python -m unittest -v test_run218 test_run220 test_run222
          python run222.py --cohort cohort.json --out "$GITHUB_WORKSPACE/artifacts/run222/task-${{ matrix.task_index }}" --task-index ${{ matrix.task_index }} --freeze-only
      - name: Build pinned open-model CPU runtime
        run: |
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp rev-parse HEAD > artifacts/run222/llama_cpp_commit.txt
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build -j 2 --target llama-server
      - name: Download and SHA-verify pinned Qwen2.5-Coder-7B-Instruct
        run: |
          curl -fL --retry 3 --retry-all-errors -o /tmp/model.gguf 'https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf'
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  /tmp/model.gguf' | sha256sum -c -
      - name: Start pinned model server
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/model.gguf --alias 'Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M' --host 127.0.0.1 --port 8080 -c 16384 -t 2 -np 1 > /tmp/lattice-run222-llama.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health | grep -q 'ok' && exit 0
            sleep 2
          done
          cat /tmp/lattice-run222-llama.log
          exit 1
      - name: Execute matched model controls and paired previously excluded real issues
        run: |
          cd research/K-SYNTH-1/run207
          python run222.py --cohort cohort.json --out "$GITHUB_WORKSPACE/artifacts/run222/task-${{ matrix.task_index }}" --task-index ${{ matrix.task_index }}
      - name: Preserve raw prompts, outputs, failures, and verifier traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-run222-preflight-issue-${{ matrix.task_index }}
          path: |
            artifacts/run222/**
            /tmp/lattice-run222-llama.log
          retention-days: 90
