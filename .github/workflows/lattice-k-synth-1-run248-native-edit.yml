name: Lattice Run248 pinned native-edit capable-model comparison
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run247/run247.py.zlib.b64'
      - '.github/workflows/lattice-k-synth-1-run248-native-edit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lattice-run248-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-edit-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrossGL/crosstl
          ref: d456c2b5f509104dd97b74ce40c597531784e2ca
          path: upstream
          persist-credentials: false
      - name: Restore SHA-pinned experiment code and preserve frozen source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run248-results run248-code
          python - <<'PY'
          import pathlib,base64,zlib,hashlib,shutil,json
          sources={
            'research/K-SYNTH-1/run247/run247.py.zlib.b64':('run247.py','ac06e7934b6503efbdea9e4b59076936d7d461c2bd5c1fa372e2965654e9d2e8'),
            'research/K-SYNTH-1/run246/typed_representation_v3.py.zlib.b64':('typed_representation_v3.py','d259f5a8eeda32209d217dcc6d8ab5572ca422b7c344e916f0eb05cb2dc21eb2'),
            'research/K-SYNTH-1/run249/typed_representation.py.zlib.b64':('typed_representation.py','933fd881df72a527e24e807cb9dc6221ef602bfc02499cfdcd8a694f03656435'),
            'research/K-SYNTH-1/run249/typed_representation_v2.py.zlib.b64':('typed_representation_v2.py','5358242052f2dee3e6f4d2b3163642c8389a49835a55846492d4f3f764d1861d'),
            'research/K-SYNTH-1/run240/run240.py.zlib.b64':('run240.py','657b383727fb6fa39691bc23e7f3d338cae007abf7a99d5f1cb001ba5c612b5c'),
            'research/K-SYNTH-1/run242/run242.py.zlib.b64':('run242.py','f26d7fcad3d0a0999d6311f00c4f140da94898e90d80bc8c4d0411cae96429c8'),
            'research/K-SYNTH-1/run239/qualify_crossgl.py.zlib.b64':('qualify_crossgl.py','232aaedbc91e279e77de2da68f7a303305054d5e8823329d1a569b7b523f5795')
          }
          hashes={}
          for source,(name,expected) in sources.items():
              data=zlib.decompress(base64.b64decode(pathlib.Path(source).read_text().strip()))
              digest=hashlib.sha256(data).hexdigest()
              assert digest==expected,(name,digest)
              pathlib.Path('run248-code',name).write_bytes(data)
              hashes[name]=digest
          raw=pathlib.Path('research/K-SYNTH-1/run247/trusted_compiler_v4.py').read_bytes()
          assert __import__('subprocess').check_output(['git','hash-object','research/K-SYNTH-1/run247/trusted_compiler_v4.py'],text=True).strip()=='b9d4ea3a47a9166d5fcfb03a3fb89c6f2e0715c3'
          pathlib.Path('run248-code/trusted_compiler_v4.py').write_bytes(raw)
          hashes['trusted_compiler_v4.py']=hashlib.sha256(raw).hexdigest()
          pathlib.Path('run248-results/source-hashes.json').write_text(json.dumps(hashes,sort_keys=True,indent=2))
          PY
          git -C upstream rev-parse HEAD > run248-results/upstream-commit.txt
          git rev-parse HEAD > run248-results/lattice-commit.txt
      - name: Verify immutable prospective requests and reference repair
        shell: bash
        run: |
          set -euo pipefail
          python run248-code/run247.py --repo upstream --out run248-results --freeze-only 2>&1 | tee run248-results/preflight.log
          python - <<'PY'
          import json,pathlib,hashlib
          d=json.loads(pathlib.Path('run248-results/freeze.json').read_text())
          expected={'graph_first':'2a0dedd8d06bb9edb61f3641ad39eb149a838cecfaa6f469717524e8398490e2','python_first':'439e1939cced5a61f8d00d864b3b3efa89f6aca6b5887d45cc10d1289c844c51','python_only':'e884fcc4105db8507a09a94e48ce8410fe2322989b0910af1083716f8bcb92be'}
          assert d['requests']==expected, (d['requests'],expected)
          assert d['parity']['equal_primary_components']
          print('FROZEN HASHES AND FACT PARITY VERIFIED')
          PY
      - name: Build pinned llama.cpp CPU inference engine
        run: |
          git clone --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = '620d2225cc436ab0b001e3200e590e3b286ef9ab'
          git -C /tmp/llama.cpp rev-parse HEAD > run248-results/llama-commit.txt
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build -j 2 --target llama-server
      - name: Download and verify no-cost open coding model
        run: |
          curl -fL --retry 3 --retry-all-errors -o /tmp/model.gguf 'https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf'
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  /tmp/model.gguf' | sha256sum -c -
      - name: Start pinned local model and capture exact tokenizer counts
        shell: bash
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/model.gguf --alias 'Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M' --host 127.0.0.1 --port 8080 -c 16384 -t 2 -np 1 > run248-results/llama.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health | grep -q 'ok' && break
            sleep 2
          done
          python - <<'PY'
          import json,pathlib,urllib.request
          out={}
          for arm in ('graph_first','python_first','python_only'):
              p=pathlib.Path('run248-results')/(arm+'-request.json')
              req=json.loads(p.read_text())
              text=req['messages'][0]['content']
              body=json.dumps({'content':text}).encode()
              try:
                  r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/tokenize',data=body,headers={'Content-Type':'application/json'}),timeout=120)
                  out[arm]={'prompt_content_tokens':len(json.load(r)['tokens'])}
              except Exception as e:
                  out[arm]={'tokenizer_error':repr(e)}
          pathlib.Path('run248-results/tokenizer-counts.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(out)
          PY
      - name: Run frozen three-arm capable-model comparison with identical native compiler and oracle
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python run248-code/run247.py --repo upstream --out run248-results 2>&1 | tee run248-results/inference.log
      - name: Preserve complete exact prompts, raw completions, usage, failures and evaluator traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-run248-crossgl-native-python-graph-order-qwen
          path: |
            run248-results/
            run248-code/
          retention-days: 90
          if-no-files-found: warn
