name: Lattice Run227 partial-solve oracle witness
on:
  push:
    branches: [research/exp003-context-order]
    paths:
      - 'research/K-SYNTH-1/run227/**'
      - '.github/workflows/lattice-k-synth-1-run227-oracle.yml'
  workflow_dispatch:
jobs:
  oracle-counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned-source partial-solve witness
        run: |
          python research/K-SYNTH-1/run227/run227_partial_solve_witness.py | tee run227-witness.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run227-oracle-witness
          path: run227-witness.txt
          if-no-files-found: ignore
