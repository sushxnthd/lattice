name: sequential-edits-exp002
on:
  push:
    branches: [research/exp002-semantic-edits]
    paths:
      - 'experiments/exp002/**'
      - 'src/lattice/semantic_edits.py'
      - '.github/workflows/sequential-edits.yml'
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [Qwen/Qwen2.5-Coder-0.5B-Instruct, Qwen/Qwen2.5-Coder-1.5B-Instruct]
    env:
      LATTICE_MODEL: ${{ matrix.model }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.48.3 pytest
      - run: pip install -e .
      - run: pytest -q
      - run: python experiments/exp002/sequential_edits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequential-${{ strategy.job-index }}
          path: artifacts/exp002/*.json
